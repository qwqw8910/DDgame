<!doctype html>
<html lang="zh-TW" data-theme="mygame">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a1a" />
    <link rel="icon" href="/DDgame/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/DDgame/apple-touch-icon-180x180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="甜甜小秘密" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>甜甜的小秘密</title>
    <script>
      (function(){
        var t = localStorage.getItem('theme');
        if (t === 'light') document.documentElement.setAttribute('data-theme','light');
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
